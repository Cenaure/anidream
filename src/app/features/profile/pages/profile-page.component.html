<div class="min-h-screen bg-zinc-900 text-zinc-100 p-6">
  <div class="mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center gap-4 pb-6 border-b border-zinc-700">
      <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-600 flex items-center justify-center text-2xl font-semibold">
        C
      </div>
      <div>
        <h1 class="text-xl font-semibold">{{user()?.username}}</h1>
      </div>
    </div>

    <!-- Profile -->
    <div class="space-y-2">
      <p class="text-xs uppercase tracking-widest text-zinc-500">Profile</p>
      <div class="rounded-lg border border-zinc-700 divide-y divide-zinc-700">
        <div class="flex items-center justify-between px-4 py-3">
          <div>
            <p class="text-xs text-zinc-500">Username</p>
            <p class="font-bold">{{user()?.username}}</p>
          </div>
        </div>
        <div class="flex items-center justify-between px-4 py-3">
          <div>
            <p class="text-xs text-zinc-500">Email</p>
            <p class="font-bold">{{user()?.email}}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Danger -->
    <div class="space-y-2">
      <p class="text-xs uppercase tracking-widest text-zinc-500">Danger zone</p>
      <div class="rounded-lg border border-red-900 divide-y divide-red-900">
        <div class="flex items-center justify-between px-4 py-3">
          <div>
            <p class="text-xs text-zinc-500">Logout</p>
            <p class="text-sm">End your current session</p>
          </div>
          <button (click)="logout()" class="cursor-pointer text-xs text-red-400 hover:text-red-300 border border-red-900/50 hover:border-red-700 px-3 py-1 rounded-md transition-colors">
            Logout
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
