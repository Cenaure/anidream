<div
  class="group h-full w-full relative rounded-xl overflow-hidden cursor-pointer bg-mauve-800/70
                 ring-1 ring-white/5 hover:ring-violet-500/50
                 transition-all duration-300 shadow-lg hover:shadow-violet-900/30
                 animate-[fadeUp_0.4s_ease_both]">

  <div class="relative aspect-2/3 overflow-hidden">
    <img
      class="w-full h-full object-cover transition-transform duration-400 ease-in-out group-hover:scale-[1.06]"
      [ngSrc]="anime.images?.webp?.large_image_url || anime.images?.webp?.image_url || ''"
      [alt]="anime.titles?.[0]?.title"
      fill
      priority
      style="object-fit: cover"
    />

    <div class="absolute inset-0 flex flex-col justify-end p-2
                        bg-linear-to-t from-black/85 via-black/20 to-transparent
                        opacity-0 group-hover:opacity-100 transition-opacity duration-300">

      <div class="flex items-center justify-between mb-1">
        @if (anime.score) {
          <span class="text-yellow-400 text-xs font-semibold px-1.5 py-0.5 rounded-md bg-black/55 backdrop-blur-sm">
                    ⭐ {{ anime.score }}
                  </span>
        }
        @if (anime.rank) {
          <span class="text-zinc-300 text-xs px-1.5 py-0.5 rounded-md bg-black/55 backdrop-blur-sm">
                    #{{ anime.rank }}
                  </span>
        }
      </div>

      @if (anime.genres != null && anime.genres.length > 0) {
        <div class="flex flex-wrap gap-1">
          @for (genre of anime.genres.slice(0, 2); track genre.mal_id) {
            <span class="text-[10px] bg-violet-600/80 text-white px-1.5 py-0.5 rounded-full">
                      {{ genre.name }}
                    </span>
          }
        </div>
      }
    </div>
  </div>

  <div class="px-2 py-1.5">
    <p class="text-[0.8rem] text-zinc-200 text-center line-clamp-2 leading-snug font-medium">
      {{ anime.titles?.[0]?.title }}
    </p>
    @if (anime.year) {
      <p class="text-[10px] text-zinc-500 text-center mt-0.5">{{ anime.year }}</p>
    }
  </div>
</div>
