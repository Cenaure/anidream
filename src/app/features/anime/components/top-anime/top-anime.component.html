<section class="mt-6 space-y-5">
  <div class="flex items-end justify-between">
    <div class="flex items-end gap-3">
      <h2 class="text-xl font-semibold text-mauve-200 tracking-tight uppercase">Best releases</h2>
    </div>
    <button
      class="text-sm text-violet-400 hover:text-violet-300 transition-colors duration-200 cursor-pointer">
      view all ->
    </button>
  </div>

  <!--Fallback-->
  @if (isLoading()) {
    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
      @for (item of [].constructor(12); track $index) {
        <div class="rounded-xl bg-zinc-800 animate-pulse aspect-2/3 w-full"></div>
      }
    </div>
  }

  <!--Loaded List-->
  @if (!isLoading()) {
    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-7 gap-3">
      @for (anime of displayed(); track anime.mal_id) {
        <a [routerLink]="['/anime', anime.mal_id]">
          <app-anime-card [anime]="anime" />
        </a>
      }
    </div>
  }
</section>
