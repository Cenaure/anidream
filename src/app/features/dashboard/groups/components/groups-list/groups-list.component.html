<div class="bg-zinc-800/20 ring-1 ring-zinc-700 p-4 rounded-md">
  <ng-template #actions let-row >
    <div class="gap-2 flex">
      <app-alert
        title="Delete group?"
        description="This will permanently delete the group."
        confirmLabel="Delete"
        (confirmed)="deleteGroup(row)">
        <button class="text-red-600 hover:text-red-700 flex justify-center w-full cursor-pointer hover:bg-slate-100/10 p-2 rounded-full transition-all duration-200">
          <ng-icon name="phosphorTrash" size="18" />
        </button>
      </app-alert>

      <button class="flex items-center cursor-pointer p-1 text-zinc-400 hover:text-zinc-100 border border-zinc-700 hover:border-zinc-500 rounded-md transition-colors" (click)="routeToEditPage(row.id || '')">
        <ng-icon name="phosphorPencilSimple" size="18" />
      </button>
    </div>
  </ng-template>

  <app-tanstack-table
    [columns]="columns"
    [data]="groups()"
    [actionsTemplate]="actions"
    filterColumn="name"
    [totalRows]="totalRows()"
    [pageSize]="query().perPage"
    [serverSide]="true"
    (pageChange)="onPageChange($event)"
    (filterChange)="onFilterChange($event)"
    (sortChange)="onSortChange($event)"
  />
</div>
