<ng-template #actions let-row>
  <div class="gap-2 flex">
    <button class="flex items-center cursor-pointer p-1 text-zinc-400 hover:text-zinc-100 border border-zinc-700 hover:border-zinc-500 rounded-md transition-colors" (click)="hrefToEditPage(row.mal_id || '')">
      <ng-icon name="phosphorPencilSimple" size="18" />
    </button>
  </div>
</ng-template>

<app-tanstack-table
  [columns]="columns"
  [data]="producers()"
  [actionsTemplate]="actions"
  filterColumn="name"
  [totalRows]="totalRows()"
  [pageSize]="query().perPage"
  [serverSide]="true"
  (pageChange)="onPageChange($event)"
  (filterChange)="onFilterChange($event)"
  (sortChange)="onSortChange($event)"
/>
