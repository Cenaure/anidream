<ng-template #actions let-row>
  <app-alert
    title="Delete user?"
    description="This will permanently delete the user and remove their data."
    confirmLabel="Delete"
    (confirmed)="deleteUser(row)">
    <button class="text-red-600 hover:text-red-700 flex justify-center w-full cursor-pointer hover:bg-slate-100/10 p-2 rounded-full transition-all duration-200">
      <ng-icon name="phosphorTrash" size="18" />
    </button>
  </app-alert>

  <button class="cursor-pointer p-1 text-zinc-400 hover:text-zinc-100 border border-zinc-700 hover:border-zinc-500 rounded-md transition-colors" (click)="hrefToEditPage(row.id || '')">
    <ng-icon name="phosphorPencilSimple" size="18" />
  </button>
</ng-template>

<app-tanstack-table
  [columns]="_columns"
  [data]="users()"
  [actionsTemplate]="actions"
  filterColumn="email"
  [totalRows]="totalRows()"
  [pageSize]="query().perPage"
  [serverSide]="true"
  (pageChange)="onPageChange($event)"
  (filterChange)="onFilterChange($event)"
  (sortChange)="onSortChange($event)"
/>

<a [routerLink]="dashboardCreateUserRoute" hlmBtn>
  Add new user
</a>
